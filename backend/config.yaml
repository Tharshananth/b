# BrainSightAI's Chatbot Configuration
# Multi-Model LLM Support

app:
  name: "BrainSightAI Chatbot"
  version: "2.0.0"
  environment: "production"  # development, staging, production
  debug: false

# LLM Provider Configuration
llm:
  default_provider: "gemini"
  enable_fallback: true

  # FIX 1: was 3-space indent, now consistent 4-space
  fallback_order:
    - "gemini"            # OpenAI/Claude removed until their keys are valid

  providers:
    openai:
      enabled: true
      model: "gpt-4o"
      api_key_env: "OPENAI_API_KEY"
      temperature: 0.4
      max_tokens: 1500
      top_p: 0.9
      frequency_penalty: 0.0
      presence_penalty: 0.0
      stream: true
      timeout: 30

    claude:
      enabled: true
      model: "claude-3-5-sonnet-20241022"
      api_key_env: "ANTHROPIC_API_KEY"
      temperature: 0.4
      max_tokens: 1500
      top_p: 0.9
      stream: true
      timeout: 30

    gemini:
      enabled: true
      model: "gemini-3.6-flash"
      fallback_models:
        - "gemini-3.5-flash"
        - "gemini-3.5-flash-lite"
      api_key_env: "GOOGLE_API_KEY"
      temperature: 0.4
      max_tokens: 1500
      top_p: 0.9
      stream: true
      timeout: 30

    huggingface:
      enabled: true
      model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
      api_key_env: "HF_TOKEN"
      temperature: 0.7
      max_tokens: 1000
      top_p: 0.9
      stream: false
      timeout: 30

# Conversation Memory Configuration
conversation_memory:
  type: "buffer_window"
  backend: "redis"            # redis | in_process
  ttl_minutes: 60             # sliding: reset on every message
  redis:
    key_prefix: "bsai:chat:session:"
    connect_timeout_s: 0.5
    op_timeout_s: 0.5
    circuit_breaker_s: 30

  buffer_window:
    k: 10
    max_tokens: 4000
    return_messages: true
    memory_key: "chat_history"

  token_counting:
    enabled: true
    encoding: "cl100k_base"
    warning_threshold: 0.8

# Embedding Configuration
embeddings:
  provider: "huggingface"

  providers:
    openai:
      model: "text-embedding-3-small"
      api_key_env: "OPENAI_API_KEY"
      dimensions: 1536

    huggingface:
      model: "sentence-transformers/all-MiniLM-L6-v2"
      api_key_env: "HF_TOKEN"
      dimensions: 384

# Vector Database Configuration
vector_db:
  type: "chroma"
  persist_directory: "./chroma_db"
  collection_name: "BrainSightAIs_knowledge"

  search:
    k: 4
    score_threshold: 0.40  # cosine similarity (0-1). Measured: relevant ~0.48-0.66, unrelated ~0.27-0.36. Retune with scripts/tune_threshold.py
    search_type: "similarity"

  chunking:
    chunk_size: 1000
    chunk_overlap: 200
    separators: ["\n\n", "\n", ". ", " ", ""]

# Document Processing
documents:
  supported_formats:
    - ".pdf"
    - ".docx"
    - ".txt"
    - ".md"

  max_file_size: 10485760  # 10MB
  data_dir: "./data"
  upload_dir: "./uploads"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8042        # Production port (frontend calls http://4.213.16.34:8042)

  reload: false

  cors:
    enabled: true
    allow_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:8042"
      - "http://127.0.0.1:8042"
      - "http://localhost:8043"
      - "http://127.0.0.1:8043"
      - "http://localhost:5000"
      - "http://127.0.0.1:5000"
      - "http://4.213.16.34:3000"
      - "http://4.213.16.34:8042"
      - "http://4.213.16.34:8043"
      - "http://4.213.16.34:5000"
    # allow_credentials must be false with specific IP origins —
    # true + specific origins = browser silently blocks all requests (CORS error)
    allow_credentials: false
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allow_headers:
      - "*"

  rate_limit:
    enabled: true
    requests_per_minute: 60
    requests_per_hour: 1000

  timeout: 60

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  file:
    enabled: true
    path: "./logs/app.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5

  console:
    enabled: true
    colorize: true

# System Prompt
prompts:
  system: "system.md"
  react_instructions: "react_instructions.md"

citations:
  verify: true
  titles: {}

monitoring:
  enabled: true
  track_usage: true
  track_costs: true
  track_performance: true

  alerts:
    error_rate_threshold: 0.05    # 5%
    response_time_threshold: 5000  # 5 seconds
    token_usage_threshold: 1000000 # 1M tokens per day
# Orchestrator Job Database (MongoDB Atlas)
# Connection string lives in the MONGODB_URI environment variable, never here.
# The credential it carries must have the `read` role only.
job_db:
  database: "orchTest"
  collection: "executionInfo"

  # Field that identifies the tenant. CONFIRM before production —
  # this single value is what keeps one hospital from reading another's data.
  tenant_field: "hospital"

  default_limit: 10
  max_limit: 50

  server_selection_timeout_ms: 5000
  connect_timeout_ms: 5000
  socket_timeout_ms: 10000
  max_pool_size: 20

# Identity and scope
security:
  # TESTING ONLY. Lets /api/chat accept hospital / patient_id in the request
  # body so the flow can be demonstrated before the login handshake exists.
  # A client-supplied tenant is self-declared, not authenticated - anyone can
  # name any hospital. Set to false before this serves real clinicians.
  allow_client_scope: true

  # Used when allow_client_scope is on and the request names no hospital.
  default_hospital: "62"

guardrails:
  medical:
    enabled: true
    model: "gemini-3.5-flash-lite"
    fallback_models:
      - "gemini-3.5-flash"
    timeout_s: 10.0       # Google's minimum allowed deadline is 10s
    history_turns: 2          # earlier user/assistant TEXT turns sent for context
    on_error: "allow"         # allow | block  - what to do if the classifier fails
    output_check: false       # second check on the final answer (adds latency)
    canned_response: "I am an operational assistant for VoxelBox software and cannot provide medical advice or evaluate symptoms. Please consult your physician."

agent:
  max_iterations: 2

fast_path:
  enabled: true
  replies:
    greeting: "Hello! I can help with VoxelBox processing, MRI protocols, and job status. What do you need?"
    thanks: "You're welcome! Let me know if you need anything else with VoxelBox."
    bye: "Goodbye! Come back anytime you need help with VoxelBox."
    out_of_scope: "I'm the VoxelBox assistant, so I can only help with VoxelBox processing, MRI protocols, and job status. Is there something along those lines I can help with?"

performance:
  parallel_gatekeeper: false

